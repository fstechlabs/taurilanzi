name: release

# Every push to main that passes the tests is released, if it changes the app (see
# scripts/release-plan.ts). Run it by hand to release main even without such a change.
# Each system and processor is built on a machine of its own; the release is published once all
# of them are in, with one latest.json for every updater.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      title: ${{ steps.plan.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - id: plan
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: bun scripts/release-plan.ts
      - if: steps.plan.outputs.release == 'true'
        env:
          NOTES: ${{ steps.plan.outputs.notes }}
        run: cp "$NOTES" release-notes.md
      - if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: release-notes.md
          retention-days: 1

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          # The oldest Ubuntu still supported, so the packages run on every newer system too.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev libxdo-dev libasound2-dev libxkbcommon-dev patchelf rpm
      - name: Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Not every runner image comes with it.
          if ! command -v rustup >/dev/null; then
            if [ "$RUNNER_OS" = Windows ]; then
              curl -sSfLo rustup-init.exe "https://static.rust-lang.org/rustup/dist/$TARGET/rustup-init.exe"
              ./rustup-init.exe -y --profile minimal
              cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            else
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup update stable --no-self-update && rustup default stable
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: bun install --frozen-lockfile

      - name: Build and sign
        env:
          TAURILANZI_VERSION: ${{ needs.plan.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: bun scripts/build-app.ts --target "$TARGET"
      - env:
          TAURILANZI_VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: bun scripts/release-assets.ts --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: .release/
          # The folder starts with a dot, which the action skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .release
          merge-multiple: true
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bun scripts/release-manifest.ts "$VERSION" .release/release-notes.md

      # A draft is never the latest release, so the updater only sees it once every file is up.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mv .release/release-notes.md "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" .release/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
