[package]
name = "taurilanzi"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
description = "A desktop app to configure and drive Ulanzi stream docks"
authors = ["FS Tech Labs"]
license = "AGPL-3.0-only"
repository = "https://github.com/fstechlabs/taurilanzi"
homepage = "https://taurilanzi.com"

[lib]
name = "taurilanzi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Builds for the end-to-end tests: serve WebDriver from inside the app. Never in a release.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
hex = "0.4.3"
hidapi = "2.6.7"
jiff = "0.2.38"
log = "0.4"
percent-encoding = "2.3.2"
png = "0.18.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "wav", "flac", "mp4", "vorbis"] }
resvg = "0.48.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "uuid"] }
specta-typescript = "=0.0.13"
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk", "network", "component"] }
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
tauri-plugin-wdio = { version = "1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", features = ["platform-verifier"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSPasteboard", "NSRunningApplication", "NSWorkspace", "objc2-core-graphics", "NSImage", "NSImageRep", "NSBitmapImageRep", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGSession", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSGeometry", "NSString", "NSURL", "NSValue", "NSData", "NSFileManager"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3.7.0", default-features = false }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
evdev = "0.13.2"
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
unicode-normalization = "0.1.26"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = "0.13.2"
xkbcommon = "0.9.0"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "3.27.0"

# Drawing a key (resvg, PNG) unoptimized takes about 40 ms, too slow for live keys in `tauri dev`.
[profile.dev.package."*"]
opt-level = 2
